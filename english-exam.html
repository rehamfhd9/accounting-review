<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta property="og:title" content="اختبار الإنجليزي للحوكمة والتدقيق الداخلي">
<meta property="og:description" content="اختبار تفاعلي للوحدتين الأولى والثانية: ترجمة مصطلحات، قطعة قراءة صح وخطأ، واختيار من متعدد. إعداد: رهام فهد الداود">
<title>اختبار الإنجليزي للحوكمة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
/* Layout: one exam-paper column. Start sheet, sticky question tabs, score page with review. Soft cheerful palette shared with the summary: each exam question has its own colour (sky, mint, lavender). */
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --ink:#2A2733; --muted:#6C6778; --line:#ECE5DA;
  --accent:#5565BE; --accent-ink:#FFFFFF; --soft:#EFF0FA; --accent-m:#CDD3F3;
  --gold:#B0582A; --gold-bg:#FDEEE3;
  --c1:#2C74B3; --c1-t:#EAF3FC; --c1-m:#C6DEF3; --c2:#1D7D66; --c2-t:#E7F5EF; --c2-m:#BFE4D6; --c3:#7350BE; --c3-t:#F2EDFB; --c3-m:#DCD0F4;
  --ok:#2C7A4D; --ok-bg:#E5F4EA; --bad:#BE3F37; --bad-bg:#FCEAE7; --mid:#9A6A12; --mid-bg:#FBF1DC;
  --on-c:#FFFFFF; --shadow:rgba(70,50,30,.08);
  --scrim:rgba(30,20,40,.45);
  --f-display:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --f-en:'Source Serif 4','Times New Roman',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17151C; --surface:#211E28; --ink:#EEEAF3; --muted:#ABA5B8; --line:#35303F;
    --accent:#A3AEF2; --accent-ink:#161829; --soft:#2A2A3C; --accent-m:#3D4470;
    --gold:#F2B58C; --gold-bg:#36271F;
    --c1:#8EC5F1; --c1-t:#1B2836; --c1-m:#2D4864; --c2:#80D7BD; --c2-t:#182C27; --c2-m:#2B5247; --c3:#C3ABF4; --c3-t:#272139; --c3-m:#463B68;
    --ok:#7DD69E; --ok-bg:#1B3226; --bad:#F59C93; --bad-bg:#3C2222; --mid:#EBC27A; --mid-bg:#3A2F17;
    --on-c:#17151C; --shadow:rgba(0,0,0,.45);
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17151C; --surface:#211E28; --ink:#EEEAF3; --muted:#ABA5B8; --line:#35303F;
  --accent:#A3AEF2; --accent-ink:#161829; --soft:#2A2A3C; --accent-m:#3D4470;
  --gold:#F2B58C; --gold-bg:#36271F;
  --c1:#8EC5F1; --c1-t:#1B2836; --c1-m:#2D4864; --c2:#80D7BD; --c2-t:#182C27; --c2-m:#2B5247; --c3:#C3ABF4; --c3-t:#272139; --c3-m:#463B68;
  --ok:#7DD69E; --ok-bg:#1B3226; --bad:#F59C93; --bad-bg:#3C2222; --mid:#EBC27A; --mid-bg:#3A2F17;
  --on-c:#17151C; --shadow:rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); direction:rtl;
  font-family:var(--f-body); font-size:15px; line-height:1.7;
  padding-block:14px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
.wrap{max-width:760px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate;white-space:nowrap}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
p{margin:0 0 8px}
.en{font-family:var(--f-en);direction:ltr;text-align:left;unicode-bidi:isolate}

/* ---------- الرأس ---------- */
header{position:relative;overflow:hidden;padding:20px 18px 18px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(140deg,var(--gold-bg) 0%,var(--surface) 46%,var(--c3-t) 100%);box-shadow:0 10px 30px -18px var(--shadow)}
.tri{display:flex;gap:6px;margin-bottom:12px}
.tri i{display:block;width:34px;height:6px;border-radius:999px}
.tri i:nth-child(1){background:var(--c1)}.tri i:nth-child(2){background:var(--c2)}.tri i:nth-child(3){background:var(--c3)}
.eyebrow{margin:0;font-size:12.5px;color:var(--muted)}
h1{margin:4px 0 2px;font-family:var(--f-display);font-weight:700;font-size:clamp(27px,7.5vw,38px);line-height:1.35;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:13.5px}
.by{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--gold);font-weight:700;font-size:14px}
.by::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
h2{margin:18px 0 2px;font-family:var(--f-display);font-weight:700;font-size:clamp(21px,5.8vw,26px);line-height:1.45;text-wrap:balance}
.cap{margin:0 0 10px;color:var(--muted);font-size:13.5px}
h3{margin:0 0 6px;font-size:15.5px;font-weight:700;line-height:1.6}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 2px var(--shadow)}
.card + .card{margin-top:10px}
.btn{background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--accent);border-radius:12px;padding:9px 18px;min-height:44px;font-size:15px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:13.5px}
.btn:hover{filter:brightness(1.08)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:space-between}
.link{background:none;border:0;padding:6px 2px;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13.5px}

/* ---------- شاشة البداية ---------- */
.plan{width:100%;border-collapse:collapse;font-size:14.5px}
.plan th,.plan td{padding:8px 6px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
.plan th{font-size:12.5px;color:var(--muted);font-weight:600}
.plan td:last-child,.plan th:last-child{text-align:center;white-space:nowrap}
.plan tfoot td{border-bottom:0;border-top:3px double var(--muted);font-weight:700}
.lbl{margin:12px 0 5px;font-size:13px;font-weight:700;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button,.chips button{min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;cursor:pointer;padding:4px 10px;line-height:1.45}
.seg button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{flex:1 1 140px}
.tips{margin:10px 0 0;padding-inline-start:20px;color:var(--muted);font-size:13.5px}
.resume{border-color:var(--accent);background:var(--soft)}
.go{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;padding:11px 14px;border:1.5px solid var(--accent);border-radius:12px;background:var(--surface);color:var(--accent);font-weight:700;text-decoration:none}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td{padding:6px 4px;border-bottom:1px solid var(--line)}
.hist tr:last-child td{border-bottom:0}
.hist td:last-child{text-align:end;font-weight:700}

/* ---------- شريط الاختبار ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;gap:8px;align-items:center;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.pills{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:3px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill small{font-size:12px;color:var(--muted);font-weight:500}
.pill[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.q1[aria-current="true"]{background:var(--c1);border-color:var(--c1);color:var(--on-c)}
.pill.q2[aria-current="true"]{background:var(--c2);border-color:var(--c2);color:var(--on-c)}
.pill.q3[aria-current="true"]{background:var(--c3);border-color:var(--c3);color:var(--on-c)}
.pill[aria-current="true"] small{color:var(--on-c)}
#sec.q1{--qc:var(--c1);--qt:var(--c1-t)}#sec.q2{--qc:var(--c2);--qt:var(--c2-t)}#sec.q3{--qc:var(--c3);--qt:var(--c3-t)}
.pill[aria-current="true"] small{opacity:.85}
.pill.full:not([aria-current="true"]){border-color:var(--ok)}

/* ---------- الأسئلة ---------- */
.qs{display:grid;gap:10px}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px}
.qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.qh.ltr{direction:ltr}
.no{flex:none;display:grid;place-items:center;min-width:28px;height:28px;padding:0 4px;border:0;background:var(--qt,var(--soft));color:var(--qc,var(--accent));border-radius:50%;font-size:13px;font-weight:700;line-height:1}
.qt{margin:0;flex:1;min-width:0;font-weight:500;font-size:16.5px;line-height:1.7}
.qt.term{font-size:21px;font-weight:600}
.tfb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch{min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:15.5px;font-weight:700;cursor:pointer}
.ch:hover{border-color:var(--accent);background:var(--soft)}
.ch[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mo{display:grid;gap:7px}
.mo button{display:flex;gap:10px;align-items:center;min-height:46px;padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);text-align:start;font-size:15.5px;cursor:pointer}
.mo.ltr{direction:ltr}
.mo.ltr button{font-family:var(--f-en);font-size:16px;text-align:left}
.mo button:hover{border-color:var(--accent);background:var(--soft)}
.mo b{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);font-size:13px;font-family:var(--f-body)}
.mo span{min-width:0}
.mo button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mo button[aria-pressed="true"] b{background:var(--accent-ink);color:var(--accent)}
.tin{display:block;width:100%;min-height:48px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:18px;direction:rtl}
.tin:focus{border-color:var(--accent)}
.hint{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.pass{margin:0 0 12px;padding:14px 16px;background:var(--c2-t);border:1px solid var(--c2-m);border-radius:16px}
.pass h3{color:var(--c2);font-family:var(--f-en);direction:ltr;text-align:left;font-size:16px;margin-bottom:5px}
.pass p{margin:0;font-family:var(--f-en);direction:ltr;text-align:left;font-size:17px;line-height:1.85}
.part{margin:16px 0 8px;font-weight:700;color:var(--gold);font-size:15px}
.pnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}

/* ---------- نافذة التأكيد ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.modal .box{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.modal h3{font-size:17px}
.modal p{color:var(--muted);font-size:14.5px}
.modal .row{margin-top:12px;justify-content:flex-end}

/* ---------- النتيجة ---------- */
.score{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-weight:700;font-size:clamp(52px,16vw,76px);line-height:1}
.score .of{font-size:20px;color:var(--muted);font-weight:600}
.score .pc{margin-inline-start:auto;font-size:20px;font-weight:700;color:var(--accent)}
.verdict{margin:6px 0 0;font-weight:600}
.brk{display:grid;gap:10px;margin-top:14px}
.br{display:grid;grid-template-columns:96px 1fr 54px;gap:10px;align-items:center;font-size:14px}
.br .t{font-weight:600}
.meter{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.br .v{text-align:end;font-weight:700}
.focus{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--soft);font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.fchip{min-height:38px;padding:3px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-size:13.5px;font-weight:600;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchip.wrongonly[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;border-inline-start:5px solid var(--line)}
.rv.ok{border-inline-start-color:var(--ok)}
.rv.bad{border-inline-start-color:var(--bad)}
.rv.skip{border-inline-start-color:var(--mid)}
.rv + .rv{margin-top:10px}
.st{display:inline-flex;align-items:center;gap:5px;margin-bottom:6px;padding:1px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--soft)}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.bad{background:var(--bad-bg);color:var(--bad)}
.st.skip{background:var(--mid-bg);color:var(--mid)}
.src{margin-inline-start:6px;font-size:12.5px;color:var(--muted);font-weight:500}
.rv .qt{font-weight:600;margin-bottom:8px;font-size:16px}
.ansl{display:grid;gap:6px;margin:0 0 8px;font-size:14.5px}
.ansl div{display:flex;gap:8px}
.ansl .k{flex:none;min-width:84px;color:var(--muted);font-weight:600}
.ansl .v.ok{color:var(--ok);font-weight:700}
.ansl .v.bad{color:var(--bad);font-weight:700}
.mrow{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;border:1.5px solid transparent;font-size:15px;direction:ltr;font-family:var(--f-en)}
.mrow b{flex:none;width:22px;font-family:var(--f-body)}
.mrow.right{background:var(--ok-bg);border-color:var(--ok);font-weight:600}
.mrow.wrong{background:var(--bad-bg);border-color:var(--bad)}
.mrow .tag{margin-inline-start:auto;font-size:12.5px;font-weight:700;white-space:nowrap;font-family:var(--f-body)}
.mrow.right .tag{color:var(--ok)} .mrow.wrong .tag{color:var(--bad)}
.why{margin:8px 0 0;padding:8px 12px;border-radius:10px;background:var(--soft);font-size:14px;line-height:1.75}
.why .en{display:block;margin-top:2px;font-size:15px}
.why b{color:var(--gold)}
.der{margin:6px 0 0;font-size:12.5px;color:var(--mid)}
.empty-state{padding:20px 12px;text-align:center;color:var(--muted)}
@media (max-width:480px){.br{grid-template-columns:92px 1fr 48px}}
.br.q1 .meter i{background:var(--c1)}.br.q2 .meter i{background:var(--c2)}.br.q3 .meter i{background:var(--c3)}
.br.q1 .meter{background:var(--c1-t)}.br.q2 .meter{background:var(--c2-t)}.br.q3 .meter{background:var(--c3-t)}
#sec .mo button[aria-pressed="true"],#sec .ch[aria-pressed="true"]{background:var(--qc,var(--accent));border-color:var(--qc,var(--accent));color:var(--on-c)}
#sec .mo button[aria-pressed="true"] b{background:var(--on-c);color:var(--qc,var(--accent))}
#sec .mo button:hover,#sec .ch:hover{border-color:var(--qc,var(--accent));background:var(--qt,var(--soft))}
#sec .mo button[aria-pressed="true"]:hover,#sec .ch[aria-pressed="true"]:hover{background:var(--qc,var(--accent))}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .5s ease}}
</style>
</head>
<body>


<div class="wrap">
<header>
  <div class="tri" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="eyebrow"><bdi dir="ltr">English for Governance and Internal Audit</bdi><br>الوحدتان الأولى والثانية — الصفحات من <span class="num">5</span> إلى <span class="num">22</span></p>
  <h1>اختبار منتصف الفصل التفاعلي</h1>
  <p class="lead">بنفس أسئلة الاختبار: ترجمة مصطلحات، قطعة قراءة بصح وخطأ، واختيار من متعدد. أجيبي أولًا، ثم تظهر النتيجة والإجابات الصحيحة.</p>
  <span class="by">إعداد: رهام فهد الداود</span>
</header>

<main id="app">
  <section id="start" hidden></section>
  <section id="exam" hidden></section>
  <section id="result" hidden></section>
</main>
</div>
<div id="modal" hidden></div>

<script>

PAS=[{"title": "Reading Passage: Workplace Practice", "text": "Every organization needs good governance. Governance helps an organization work in an organized, responsible, and honest way. It explains who makes decisions and who is responsible for different tasks. Internal audit examines work, controls, documents, and risks. Its purpose is not only to find mistakes; it also helps the organization improve. Good governance includes responsibility, accountability, transparency, and compliance. In practice, employees should follow approved policies and procedures, keep accurate records, communicate clearly, and ask for guidance when they are uncertain. Managers and auditors should review information fairly, protect confidential documents, and record important decisions. These actions help the organization achieve its objectives and improve its work."}, {"title": "Reading Passage: Workplace Practice", "text": "A clear organizational structure shows departments, positions, reporting lines, and responsibilities. The board provides direction, senior management manages daily activities, and managers plan and control departmental work. Employees should understand their roles, communicate with supervisors, and cooperate with other departments. Delegation gives a task or authority to another person, while the manager remains responsible for checking the work. In practice, employees should follow approved policies and procedures, keep accurate records, communicate clearly, and ask for guidance when they are uncertain. Managers and auditors should review information fairly, protect confidential documents, and record important decisions. These actions help the organization achieve its objectives and improve its work."}],

function nrm(s){
  s=String(s||'').replace(/[ً-ٰٟـ]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[.,،؛:!؟?()"'«»]/g,' ');
  return s.trim().replace(/\s+/g,' ').split(' ').filter(Boolean).map(function(w){return (w.length>3&&w.indexOf('ال')===0)?w.slice(2):w}).join(' ');
}

function typedOk(i,txt){

  var whole=nrm(txt);

  return parts.every(function(p){return ACC[i].indexOf(p)>-1});

function distract(i){
  var mine=ACC[i],pool=[];

    if(j===i)return;

}

      (Q2[j].p===0?P.qa:P.qb).push(j);
    });
    if(cfg.x||only){
      shuffle(EX.map(function(_,k){return k})).forEach(function(k){
        if(want('c:'+k)&&(cfg.x||only))P.qx.push(k);
      });
    }
  }
  if(cfg.s[2]){
    shuffle(MCQ.map(function(_,m){return m})).forEach(function(m){
      if(want('d:'+m))P.q3.push({m:m,o:shuffle([0,1,2,3])});
    });
  }
  return P;
}
function fresh(){return {v:2,phase:'start',cfg:{s:[true,true,true],m:'pick',n:20,x:false},paper:null,ans:{},sec:0}}
var S=load()||fresh();
var DRAFT=JSON.parse(JSON.stringify(S.cfg));

function secs(){
  var P=S.paper,o=[];if(!P)return o;
  if(P.q1.length)o.push('q1');
  if(P.qa.length||P.qb.length||P.qx.length)o.push('q2');
  if(P.q3.length)o.push('q3');
  return o;
}
function keysOf(sec){
  var P=S.paper,k=[];
  if(sec==='q1')P.q1.forEach(function(q){k.push('a:'+q.i)});
  if(sec==='q2'){P.qa.forEach(function(j){k.push('b:'+j)});P.qb.forEach(function(j){k.push('b:'+j)});P.qx.forEach(function(j){k.push('c:'+j)})}
  if(sec==='q3')P.q3.forEach(function(q){k.push('d:'+q.m)});
  return k;
}
function allKeys(){var k=[];secs().forEach(function(s){k=k.concat(keysOf(s))});return k}
function has(k){var v=S.ans[k];return v!==undefined&&v!==null&&String(v).trim()!==''}
function judge(k){
  if(!has(k))return 'skip';
  var t=k.charAt(0),n=+k.slice(2),v=S.ans[k];
  if(t==='a')return (S.cfg.m==='pick'?v===n:typedOk(n,v))?'ok':'bad';
  if(t==='b')return ((v==='T')===Q2[n].a)?'ok':'bad';
  if(t==='c')return ((v==='T')===EX[n].a)?'ok':'bad';
  return v===MCQ[n].a?'ok':'bad';
}

/* ---------- نافذة تأكيد داخل الصفحة ---------- */
function ask(title,msg,okLabel,cancelLabel,onOk){
  var m=$('#modal'),prev=document.activeElement;
  m.innerHTML='<div class="modal" role="presentation"><div class="box" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">'+esc(title)+'</h3><p>'+esc(msg)+'</p><div class="row"><button class="btn ghost" data-x="no">'+esc(cancelLabel)+'</button><button class="btn" data-x="ok">'+esc(okLabel)+'</button></div></div></div>';
  m.hidden=false;
  function close(){m.hidden=true;m.innerHTML='';document.removeEventListener('keydown',key);if(prev&&prev.focus)prev.focus()}
  function key(e){if(e.key==='Escape')close()}
  m.onclick=function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-x');if(x==='ok'){close();onOk()}else if(x==='no'||e.target.classList.contains('modal'))close()};
  document.addEventListener('keydown',key);
  $('[data-x="ok"]',m).focus();
}

/* ---------- النتيجة ---------- */
function reviewCard(k){
  var t=k.charAt(0),n=+k.slice(2),st=judge(k),h='',lab={ok:'صحيحة',bad:'خاطئة',skip:'بلا إجابة'}[st],ic={ok:'✓',bad:'✗',skip:'—'}[st];
  var head='<div class="rv '+st+'" data-st="'+st+'"><span class="st '+st+'">'+ic+' '+lab+'</span>';
  if(t==='a'){
    var T=TERMS[n],v=S.ans[k];
    var mine=!has(k)?'—':(S.cfg.m==='pick'?disp(v):String(v));
    h=head+'<span class="src">الوحدة '+T.u+' · ص'+T.tp+'</span><p class="qt en">'+esc(T.en)+'</p><div class="ansl">'+
      '<div><span class="k">إجابتك</span><span class="v '+(st==='ok'?'ok':st==='bad'?'bad':'')+'">'+esc(mine)+'</span></div>'+
      '<div><span class="k">في الكتاب</span><span class="v ok">'+esc(disp(n))+'</span></div></div>'+
      (T.note?'<p class="hint" style="margin:0 0 6px">'+esc(T.note)+'</p>':'')+
      '<div class="why"><b>التعريف في الكتاب (ص'+T.dp+'):</b><span class="en">'+esc(T.d)+'</span></div></div>';
  }else if(t==='b'||t==='c'){
    var Q=t==='b'?Q2[n]:EX[n],v2=S.ans[k];
    var ans=function(x){return x?'True · صح':'False · خطأ'};
    h=head+'<span class="src">'+esc(Q.src)+'</span><p class="qt en">'+esc(Q.q)+'</p><div class="ansl">'+
      '<div><span class="k">إجابتك</span><span class="v '+(st==='ok'?'ok':st==='bad'?'bad':'')+'">'+(has(k)?ans(v2==='T'):'—')+'</span></div>'+
      '<div><span class="k">الصحيح</span><span class="v ok">'+ans(Q.a)+'</span></div></div>'+
      (Q.ev?'<div class="why"><b>'+(t==='b'?'من القطعة:':'من الكتاب:')+'</b><span class="en">'+esc(Q.ev)+'</span></div>':'')+'</div>';
  }else{
    var M=MCQ[n],pk=S.ans[k],P=S.paper.q3.filter(function(q){return q.m===n})[0];
    h=head+'<span class="src">ص'+M.src.replace('ص','')+'</span><p class="qt en">'+esc(M.q)+'</p><div style="display:grid;gap:5px;margin-bottom:8px">';
    P.o.forEach(function(oi,x){
      var cls=oi===M.a?'right':(oi===pk?'wrong':'');
      h+='<div class="mrow '+cls+'"><b>'+EN[x]+'</b><span>'+esc(M.o[oi])+'</span>'+(oi===M.a?'<span class="tag">الصحيحة</span>':(oi===pk?'<span class="tag">اختيارك</span>':''))+'</div>';
    });
    h+='</div><div class="why"><b>من الكتاب:</b><span class="en">'+esc(M.ref)+'</span></div>'+'</div>';
  }
  return h;
}
function renderResult(){
  var list=secs(),tot=0,ok=0,h='',rows='',wrongKeys=[];
  list.forEach(function(s){
    var k=keysOf(s),g=k.filter(function(x){return judge(x)==='ok'}).length;
    tot+=k.length;ok+=g;
    k.forEach(function(x){if(judge(x)!=='ok')wrongKeys.push(x)});
    rows+='<div class="br '+s+'"><span class="t">'+SEC[s].t+'</span><div class="meter"><i style="width:'+Math.round(100*g/k.length)+'%"></i></div><span class="v num">'+g+'/'+k.length+'</span></div>';
  });
  var pc=tot?Math.round(100*ok/tot):0;
  var verdict=pc>=90?'ممتاز، أنتِ جاهزة.':pc>=75?'جيد جدًا، راجعي الأخطاء وستكتمل.':pc>=60?'جيد. راجعي الأخطاء ثم أعيدي المحاولة.':'راجعي الملخص ثم أعيدي المحاولة.';
  h+='<h2>النتيجة</h2><div class="card"><div class="score"><span class="big num">'+ok+'</span><span class="of num">من '+tot+'</span><span class="pc num">'+pc+'%</span></div><p class="verdict">'+verdict+'</p><div class="brk">'+rows+'</div>';
  if(wrongKeys.length)h+='<p class="focus">عندك <span class="num">'+wrongKeys.length+'</span> سؤالًا للمراجعة (خاطئ أو بلا إجابة).</p>';
  h+='<div class="row" style="margin-top:12px">'+(wrongKeys.length?'<button class="btn" data-a="retry">أعيدي الأخطاء فقط</button>':'')+'<button class="btn ghost" data-a="again">اختبار جديد</button></div></div>';
  h+='<h2>مراجعة الإجابات</h2><div class="filters"><button class="fchip" data-f="all" aria-pressed="'+(S.filter!=='bad')+'">الكل</button><button class="fchip wrongonly" data-f="bad" aria-pressed="'+(S.filter==='bad')+'">الأخطاء فقط</button></div><div id="rvl">';
  list.forEach(function(s){
    h+='<p class="part">'+SEC[s].t+': '+({q1:'المصطلحات',q2:'القطعة وصح/خطأ',q3:'الاختيار من متعدد'}[s])+'</p>';
    keysOf(s).forEach(function(k){h+=reviewCard(k)});
  });
  h+='</div><p class="empty-state" id="none" hidden>لا توجد أخطاء. أحسنتِ!</p><p class="hint" style="text-align:center;margin-top:18px">إعداد: رهام فهد الداود</p>';
  $('#result').innerHTML=h;
  applyFilter();
  S.wrong=wrongKeys;
}
function applyFilter(){
  var bad=S.filter==='bad',any=false;
  $$('#rvl .rv').forEach(function(r){var hide=bad&&r.getAttribute('data-st')==='ok';r.hidden=hide;if(!hide)any=true});
  $$('#rvl .part').forEach(function(p){var n=p.nextElementSibling,vis=false;while(n&&!n.classList.contains('part')){if(!n.hidden)vis=true;n=n.nextElementSibling}p.hidden=!vis});
  $('#none').hidden=any;
}
$('#result').addEventListener('click',function(e){
  var f=e.target.closest('button[data-f]');
  if(f){S.filter=f.getAttribute('data-f');save();$$('.fchip').forEach(function(x){x.setAttribute('aria-pressed',String(x===f))});applyFilter();return}
  var b=e.target.closest('button[data-a]');if(!b)return;
  var a=b.getAttribute('data-a');
  if(a==='again'){S.phase='start';save();DRAFT=JSON.parse(JSON.stringify(S.cfg));show('start');renderStart()}
  else if(a==='retry'){
    var only=S.wrong.slice(),cfg=JSON.parse(JSON.stringify(S.cfg));
    S={v:2,phase:'exam',cfg:cfg,paper:gen(cfg,only),ans:{},sec:0};save();show('exam');renderExam();
  }
});

/* ---------- التشغيل ---------- */
if(S.phase==='start'||!S.paper){S.phase='start';show('start');renderStart()}
else{show('start');renderStart()}
})();
</script>
